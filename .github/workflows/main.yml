name: Guardian X Fusion Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fusion-tests:
    name: Guardian X Fusion Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Guardian X
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      
      - name: Check Guardian X Server Syntax
        run: node --check server.js
        
      - name: Run Guardian X Fusion Tests
        run: npm run test:fusion

      - name: Run Guardian X Multi-Sensor Fusion Tests
        run: node fusion/fusionSessionTest.js

      - name: Run Guardian X Approver Policy Tests
        run: node fusion/approverPolicyTest.js
